<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | VÉLORA</title>

<link rel="stylesheet"
          href="velora.css">
    <link rel="stylesheet" href="create.css">
</head>
<body>

<header class="auth-header">

              <div class="logo"><img src="logo-removebg-preview.png" class="logm" style="width: ;" srcset=""> <span class="logt">É L O R A</span></div>


</header>

<section class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Join VÉLORA and start discovering exceptional stays.
        </p>

        <form id="createAccountForm">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >
            </div>

            <button type="submit" class="create-account-btn">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="sign.html">Sign In</a>
        </p>

    </div>

</section>

<script src="create.js"></script>
    <script src="velora.js"></script>


</body>
</html>
