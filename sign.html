<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In — VÉLORA</title>

    <link rel="stylesheet"
          href="velora.css">

    <link rel="stylesheet"
          href="responsive.css">

</head>

<body>

    <header class="auth-navbar">

                   <div class="logo"><img src="logo-removebg-preview.png" class="logm"></div>

            


        <a href="index.html"
           class="back-home">

            Back to home

        </a>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <p class="section-label">
                    WELCOME BACK
                </p>

                <h1>
                    Sign <em>in.</em>
                </h1>

                <p>
                    Welcome back to your world of beautiful stays.
                </p>

            </div>


            <form id="signInForm"
                  class="auth-form">


                <div class="form-group">

                    <label for="signInEmail">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="signInEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signInPassword">
                        PASSWORD
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signInPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            Show

                        </button>

                    </div>

                </div>


                <div class="auth-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="#"
                       class="forgot-password">

                        Forgot password?

                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-submit">

                    Sign In

                </button>


                <div class="divider">

                    <span>OR</span>

                </div>

    <button
                    type="button"
                    class="google-button">

                    Continue with Google

                </button>

                <p class="auth-footer">

                    Don't have an account?

                    <a href="create.html">
                        Create an account
                    </a>

                </p>

            </form>

        </section>

    </main>
<footer class="footer">

    <div class="footer-content">

        <h3>VÉLORA</h3>

        <p>
            Curated stays. Exceptional experiences.
        </p>

        <div class="footer-links">

            <a href="discover.html">Discover</a>
            <a href="stays.html">Stays</a>
            <a href="list-property.html">List Property</a>
            <a href="contact.html">Contact</a>

        </div>

    </div>

</footer>

    <script src="velora.js"></script>

</body>

</html>
