<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complete Your Booking | VÉLORA</title>

<link rel="stylesheet" href="velora.css">
   <link rel="stylesheet" href="book.css">
</head>

<body>

    <header class="booking-header">
                   <div class="logo"><img src="logo-removebg-preview.png" class="logm"></div>

        <a href="stays.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to stays
        </a>
    </header>


    <main class="booking-container">

        <section class="booking-form-section">

            <h1>Complete your booking</h1>

            <p class="booking-subtitle">
                You're one step away from your VÉLORA experience.
            </p>


            <form id="bookingForm">

                <div class="form-section">

                    <h2>Your details</h2>

                    <div class="input-row">

                        <div class="input-group">
                            <label for="firstName">First name</label>
                            <input type="text" id="firstName" required>
                        </div>

                        <div class="input-group">
                            <label for="lastName">Last name</label>
                            <input type="text" id="lastName" required>
                        </div>

                    </div>


                    <div class="input-group">

                        <label for="email">Email address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="phone">Phone number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="+234"
                            required
                        >

                    </div>

                </div>


                <div class="form-section">

                    <h2>Payment details</h2>

                    <div class="input-group">

                        <label for="cardNumber">Card number</label>

                        <input
                            type="text"
                            id="cardNumber"
                            placeholder="1234 5678 9012 3456"
                            required
                        >

                    </div>


                    <div class="input-row">

                        <div class="input-group">

                            <label for="expiry">Expiry date</label>

                            <input
                                type="text"
                                id="expiry"
                                placeholder="MM/YY"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="cvv">CVV</label>

                            <input
                                type="text"
                                id="cvv"
                                placeholder="123"
                                required
                            >

                        </div>

                    </div>

                </div>


                <button type="submit" class="confirm-booking-btn">

                    Confirm booking

                </button>

            </form>

        </section>


        <aside class="booking-summary">

            <h2>Your reservation</h2>
            <div class="booking-details-card">
                <img src="f.jpeg" alt="" srcset="">
            </div>
            <div id="bookingDetails">

                <!-- Booking information will appear here -->

            </div>

        </aside>

    </main>
<footer class="footer">

    <div class="footer-content">

        <h3>VÉLORA</h3>

        <p>
            Curated stays. Exceptional experiences.
        </p>

        <div class="footer-links">

            <a href="discover.html">Discover</a>
            <a href="stays.html">Stays</a>
            <a href="list-property.html">List Property</a>
            <a href="contact.html">Contact</a>

        </div>

    </div>

</footer>
 <script src="book.js"></script>
 <script src="velora.js"></script>
</body>
</html>
